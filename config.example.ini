[server]
listen_host = 127.0.0.1
listen_port = 8123

[auth]
# Set a private token in config.ini. Never commit config.ini.
token = replace-with-a-random-token

[cors]
allow_all_origins = false
allowed_origins = http://localhost:8000

[targets]
# Comma-separated scheme/host patterns. Private and loopback addresses are blocked.
allow = https://*
